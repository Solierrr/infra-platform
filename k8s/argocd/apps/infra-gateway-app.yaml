apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Solierrr/infra-platform.git
    targetRevision: main
    path: k8s/apps/infra-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: solierrr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
