apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: solierrr

resources:
  - ../../base/web-app

namePrefix: web-app-

labels:
  - pairs:
      app: web-app
      app.kubernetes.io/part-of: solierrr
    includeSelectors: true

images:
  - name: placeholder/placeholder
    newName: SEU_USUARIO_DOCKERHUB/solierrr-web-app
    newTag: latest

patches:
  - path: patch-nodeport.yaml
    target:
      kind: Service
      name: app
