# NOTE: ai-validation's main.py has a working FastAPI app with GET /health,
# but fastapi/uvicorn aren't pinned in requirements.txt and the Dockerfile
# has no CMD to actually start the server. The overlay is ready, but the
# container will exit immediately until the repo's Dockerfile runs uvicorn.
# See ../../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: solierrr

resources:
  - ../../base/api-python

namePrefix: ai-validation-

labels:
  - pairs:
      app: ai-validation
      app.kubernetes.io/part-of: solierrr
    includeSelectors: true

images:
  - name: placeholder/placeholder
    newName: SEU_USUARIO_DOCKERHUB/solierrr-ai-validation
    newTag: latest

patches:
  - path: patch-env.yaml
    target:
      kind: Deployment
      name: app
  - path: patch-healthcheck.yaml
    target:
      kind: Deployment
      name: app
