# NOTE: infra-gateway is currently an empty skeleton in its own repo (no
# requirements.txt, no source code, Dockerfile references a file that
# doesn't exist yet). This overlay is ready, but the image build will fail
# until that repo has real code. See ../../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: solierrr

resources:
  - ../../base/api-python

namePrefix: infra-gateway-

labels:
  - pairs:
      app: infra-gateway
      app.kubernetes.io/part-of: solierrr
    includeSelectors: true

images:
  - name: placeholder/placeholder
    newName: SEU_USUARIO_DOCKERHUB/solierrr-infra-gateway
    newTag: latest

patches:
  - path: patch-nodeport.yaml
    target:
      kind: Service
      name: app
